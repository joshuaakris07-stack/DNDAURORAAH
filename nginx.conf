server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # long-cache hashed static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # the self-contained character sheet + race art are static files
    location /sheet/ { try_files $uri =404; }
    location /race-art/ { try_files $uri =404; }

    # SPA fallback — every other route resolves to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
